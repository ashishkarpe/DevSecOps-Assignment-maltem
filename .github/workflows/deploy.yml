name: Build And Deploy To EKS

on:
  workflow_dispatch:
    inputs:
      deploy_to_eks:
        description: "Set to true only when the EKS cluster already exists and you want to deploy the app"
        required: true
        default: "false"
      image_tag:
        description: "Optional custom image tag. Leave empty to use the commit SHA."
        required: false
        default: ""

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: ap-southeast-1
  EKS_CLUSTER_NAME: redemption-eks
  ECR_REPOSITORY: redemption
  K8S_NAMESPACE: redemption

jobs:
  build-and-deploy:
    name: Build, Push, and Deploy
    runs-on: ubuntu-latest
    if: ${{ github.event.inputs.deploy_to_eks == 'true' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}

      - name: Resolve account ID
        id: aws-account
        run: |
          echo "account_id=$(aws sts get-caller-identity --query Account --output text)" >> "$GITHUB_OUTPUT"

      - name: Login to Amazon ECR
        env:
          AWS_ACCOUNT_ID: ${{ steps.aws-account.outputs.account_id }}
        run: |
          aws ecr get-login-password --region "$AWS_REGION" \
            | docker login --username AWS --password-stdin "$AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com"

      - name: Build and push image
        id: image
        env:
          AWS_ACCOUNT_ID: ${{ steps.aws-account.outputs.account_id }}
        run: |
          IMAGE_TAG="${{ github.event.inputs.image_tag }}"
          if [ -z "$IMAGE_TAG" ]; then
            IMAGE_TAG="${GITHUB_SHA}"
          fi
          IMAGE_URI="$AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/$ECR_REPOSITORY:$IMAGE_TAG"
          docker build -t "$IMAGE_URI" .
          docker push "$IMAGE_URI"
          echo "image_uri=$IMAGE_URI" >> "$GITHUB_OUTPUT"

      - name: Install kubectl
        uses: azure/setup-kubectl@v4

      - name: Configure kubeconfig
        run: |
          aws eks update-kubeconfig \
            --name "$EKS_CLUSTER_NAME" \
            --region "$AWS_REGION"

      - name: Deploy manifests
        env:
          IMAGE_URI: ${{ steps.image.outputs.image_uri }}
        run: |
          kubectl apply -f k8s/namespace.yaml
          kubectl wait --for=jsonpath='{.status.phase}'=Active namespace/"$K8S_NAMESPACE" --timeout=60s
          kubectl apply -f k8s/
          kubectl set image deployment/redemption app="$IMAGE_URI" -n "$K8S_NAMESPACE"
          kubectl rollout status deployment/redemption -n "$K8S_NAMESPACE" --timeout=5m

      - name: Smoke test service
        run: |
          kubectl get pods -n "$K8S_NAMESPACE"
          kubectl get ingress -n "$K8S_NAMESPACE"
          kubectl wait --for=condition=available deployment/redemption -n "$K8S_NAMESPACE" --timeout=5m
