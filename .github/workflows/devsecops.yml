name: DevSecOps Pipeline

on:
  pull_request:
  push:
    branches:
      - main
      - master
      - release
      - develop

permissions:
  contents: read
  actions: read
  issues: read

jobs:
  gitleaks:
    name: Gitleaks Secret Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
        with:
          args: detect --source . --no-banner --redact --report-format json --report-path gitleaks.json

      - name: Upload Gitleaks report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-report
          path: gitleaks.json
          if-no-files-found: ignore

  sbom:
    name: Trivy SBOM Generation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate CycloneDX SBOM
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          scan-ref: .
          format: cyclonedx
          output: sbom.cdx.json
          ignore-unfixed: true

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v4
        with:
          name: sbom-cyclonedx
          path: sbom.cdx.json

  trivy:
    name: Trivy IaC and Filesystem Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run Trivy filesystem scan
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          scan-ref: .
          format: table
          ignore-unfixed: true
          severity: CRITICAL,HIGH

      - name: Run Trivy config scan
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: config
          scan-ref: .
          format: table
          ignore-unfixed: true
          severity: CRITICAL,HIGH

  sonarqube:
    name: SonarQube Analysis
    runs-on: ubuntu-latest
    needs:
      - gitleaks
      - sbom
      - trivy
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
      SONAR_PROJECT_KEY: ${{ secrets.SONAR_PROJECT_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect SonarQube configuration
        id: sonar-config
        run: |
          if [ -z "$SONAR_TOKEN" ] || [ -z "$SONAR_HOST_URL" ] || [ -z "$SONAR_PROJECT_KEY" ]; then
            echo "SonarQube secrets are not configured. Skipping scan."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      - name: SonarQube Scan
        if: steps.sonar-config.outputs.enabled == 'true'
        uses: sonarsource/sonarqube-scan-action@v4
        with:
          args: >
            -Dsonar.projectKey=${{ env.SONAR_PROJECT_KEY }}
            -Dsonar.projectName=Cloud Engineer Assessment 2026
            -Dsonar.sources=.
            -Dsonar.exclusions=.git/**,.github/**,Cloud Engineer Assessment 2026.pdf
            -Dsonar.sourceEncoding=UTF-8

  zap-baseline:
    name: OWASP ZAP Baseline Scan
    runs-on: ubuntu-latest
    needs:
      - gitleaks
      - sbom
      - trivy
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Start temporary target app
        run: |
          docker run -d --rm --name redemption-zap -p 8080:8080 nginxinc/nginx-unprivileged:stable-alpine
          curl --retry 10 --retry-delay 3 --retry-connrefused http://127.0.0.1:8080

      - name: Run ZAP baseline scan
        continue-on-error: true
        uses: zaproxy/action-baseline@v0.14.0
        with:
          target: http://127.0.0.1:8080
          allow_issue_writing: false
          fail_action: false
          cmd_options: '-a'
