<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1180" viewBox="0 0 1800 1180" role="img" aria-labelledby="title desc">
  <title id="title">Production Architecture for the Redemption Service on AWS EKS</title>
  <desc id="desc">Production AWS architecture showing CI/CD, ECR, Route 53, WAF, public ALB, VPC public and private subnets, NAT gateways, EKS workloads, controllers, IAM roles for service accounts, Secrets Manager, and CloudWatch observability.</desc>
  <defs>
    <style>
      .canvas { fill: #f8fafc; }
      .boundary { fill: #ffffff; stroke: #334155; stroke-width: 2; rx: 14; }
      .zone { fill: #f1f5f9; stroke: #64748b; stroke-width: 1.5; stroke-dasharray: 9 7; rx: 12; }
      .public { fill: #e0f2fe; stroke: #0369a1; stroke-width: 2; rx: 10; }
      .private { fill: #ecfdf5; stroke: #047857; stroke-width: 2; rx: 10; }
      .security { fill: #fff7ed; stroke: #c2410c; stroke-width: 2; rx: 10; }
      .data { fill: #fef9c3; stroke: #a16207; stroke-width: 2; rx: 10; }
      .ops { fill: #eef2ff; stroke: #4338ca; stroke-width: 2; rx: 10; }
      .cicd { fill: #fdf2f8; stroke: #be185d; stroke-width: 2; rx: 10; }
      .label { font-family: Arial, sans-serif; font-size: 18px; font-weight: 700; fill: #0f172a; }
      .text { font-family: Arial, sans-serif; font-size: 17px; fill: #1e293b; }
      .small { font-family: Arial, sans-serif; font-size: 13px; fill: #475569; }
      .tiny { font-family: Arial, sans-serif; font-size: 12px; fill: #64748b; }
      .title { font-family: Arial, sans-serif; font-size: 32px; font-weight: 700; fill: #0f172a; }
      .subtitle { font-family: Arial, sans-serif; font-size: 15px; fill: #475569; }
      .arrow { stroke: #0f172a; stroke-width: 2.4; fill: none; marker-end: url(#arrow); }
      .softArrow { stroke: #475569; stroke-width: 2; fill: none; marker-end: url(#arrowSoft); stroke-dasharray: 7 5; }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#0f172a" />
    </marker>
    <marker id="arrowSoft" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#475569" />
    </marker>
  </defs>

  <rect width="1800" height="1180" class="canvas" />
  <text x="55" y="58" class="title">Redemption Service - Production AWS EKS Architecture</text>
  <text x="55" y="84" class="subtitle">Multi-AZ, private workloads, least privilege, autoscaling, DevSecOps supply chain, and observable recovery paths.</text>

  <rect x="55" y="120" width="520" height="160" class="boundary" />
  <text x="80" y="152" class="label">Delivery and Supply Chain</text>
  <rect x="85" y="180" width="150" height="62" class="cicd" />
  <text x="113" y="207" class="text">GitHub</text>
  <text x="102" y="229" class="small">PR + branch gates</text>
  <rect x="280" y="180" width="180" height="62" class="cicd" />
  <text x="310" y="207" class="text">GitHub Actions</text>
  <text x="303" y="229" class="small">SAST, SBOM, ZAP</text>
  <rect x="500" y="180" width="145" height="62" class="data" />
  <text x="552" y="207" class="text">ECR</text>
  <text x="521" y="229" class="small">Signed image store</text>
  <path d="M235 211 H280" class="arrow" />
  <path d="M460 211 H500" class="arrow" />

  <rect x="690" y="120" width="610" height="160" class="boundary" />
  <text x="715" y="152" class="label">Public Entry Path</text>
  <rect x="720" y="180" width="125" height="62" class="public" />
  <text x="752" y="207" class="text">Users</text>
  <text x="738" y="229" class="small">Global traffic</text>
  <rect x="880" y="180" width="140" height="62" class="public" />
  <text x="918" y="207" class="text">Route 53</text>
  <text x="904" y="229" class="small">DNS routing</text>
  <rect x="1055" y="180" width="115" height="62" class="security" />
  <text x="1084" y="207" class="text">WAF</text>
  <text x="1072" y="229" class="small">L7 filters</text>
  <rect x="1205" y="180" width="140" height="62" class="public" />
  <text x="1240" y="207" class="text">Public ALB</text>
  <text x="1228" y="229" class="small">TLS + health checks</text>
  <path d="M845 211 H880" class="arrow" />
  <path d="M1020 211 H1055" class="arrow" />
  <path d="M1170 211 H1205" class="arrow" />

  <rect x="55" y="330" width="1260" height="630" class="boundary" />
  <text x="85" y="364" class="label">AWS VPC - Multi-AZ Network Boundary</text>

  <rect x="95" y="400" width="370" height="500" class="zone" />
  <text x="120" y="430" class="label">Availability Zone A</text>
  <rect x="125" y="465" width="300" height="82" class="public" />
  <text x="195" y="496" class="text">Public Subnet</text>
  <text x="181" y="520" class="small">ALB ENI + NAT Gateway</text>
  <rect x="125" y="585" width="300" height="245" class="private" />
  <text x="195" y="616" class="text">Private Subnet</text>
  <rect x="155" y="650" width="240" height="62" class="private" />
  <text x="219" y="677" class="text">EKS Node</text>
  <text x="202" y="699" class="small">Redemption pod</text>
  <rect x="155" y="735" width="240" height="62" class="ops" />
  <text x="202" y="762" class="text">HPA Target</text>
  <text x="192" y="784" class="small">CPU + memory signals</text>

  <rect x="500" y="400" width="370" height="500" class="zone" />
  <text x="525" y="430" class="label">Availability Zone B</text>
  <rect x="530" y="465" width="300" height="82" class="public" />
  <text x="600" y="496" class="text">Public Subnet</text>
  <text x="586" y="520" class="small">ALB ENI + NAT Gateway</text>
  <rect x="530" y="585" width="300" height="245" class="private" />
  <text x="600" y="616" class="text">Private Subnet</text>
  <rect x="560" y="650" width="240" height="62" class="private" />
  <text x="624" y="677" class="text">EKS Node</text>
  <text x="607" y="699" class="small">Redemption pod</text>
  <rect x="560" y="735" width="240" height="62" class="ops" />
  <text x="604" y="762" class="text">PDB + Probes</text>
  <text x="606" y="784" class="small">Zero-downtime rollout</text>

  <rect x="905" y="400" width="370" height="500" class="zone" />
  <text x="930" y="430" class="label">Availability Zone C</text>
  <rect x="935" y="465" width="300" height="82" class="public" />
  <text x="1005" y="496" class="text">Public Subnet</text>
  <text x="991" y="520" class="small">ALB ENI + NAT Gateway</text>
  <rect x="935" y="585" width="300" height="245" class="private" />
  <text x="1005" y="616" class="text">Private Subnet</text>
  <rect x="965" y="650" width="240" height="62" class="private" />
  <text x="1029" y="677" class="text">EKS Node</text>
  <text x="1012" y="699" class="small">Redemption pod</text>
  <rect x="965" y="735" width="240" height="62" class="ops" />
  <text x="997" y="762" class="text">Topology Spread</text>
  <text x="1002" y="784" class="small">AZ-aware placement</text>

  <rect x="145" y="858" width="1030" height="62" class="security" />
  <text x="436" y="888" class="text">Network Policies + Security Groups + Private Worker Nodes</text>
  <text x="487" y="909" class="small">Pods are not public; traffic enters through ALB and Kubernetes service routing.</text>

  <path d="M1275 242 V318 C1275 360 1090 360 1090 465" class="arrow" />
  <path d="M1275 318 C1275 360 680 360 680 465" class="arrow" />
  <path d="M1275 318 C1275 360 275 360 275 465" class="arrow" />

  <rect x="1370" y="330" width="370" height="305" class="boundary" />
  <text x="1395" y="364" class="label">Cluster Control and Access</text>
  <rect x="1405" y="395" width="300" height="58" class="ops" />
  <text x="1462" y="421" class="text">AWS Load Balancer Controller</text>
  <text x="1468" y="442" class="small">Ingress reconciles ALB targets</text>
  <rect x="1405" y="475" width="300" height="58" class="ops" />
  <text x="1464" y="501" class="text">Cluster Autoscaler / Karpenter</text>
  <text x="1489" y="522" class="small">Adds capacity during spikes</text>
  <rect x="1405" y="555" width="300" height="58" class="security" />
  <text x="1498" y="581" class="text">IRSA / IAM</text>
  <text x="1472" y="602" class="small">Controller least privilege</text>

  <path d="M1405 424 C1320 424 1280 476 1235 506" class="softArrow" />
  <path d="M1405 504 C1320 504 1285 690 1205 681" class="softArrow" />
  <path d="M1405 584 C1320 584 1265 760 1205 766" class="softArrow" />

  <rect x="1370" y="680" width="370" height="280" class="boundary" />
  <text x="1395" y="714" class="label">Platform Services</text>
  <rect x="1405" y="745" width="140" height="58" class="data" />
  <text x="1453" y="771" class="text">ECR</text>
  <text x="1425" y="792" class="small">Image pulls</text>
  <rect x="1570" y="745" width="140" height="58" class="security" />
  <text x="1592" y="771" class="text">Secrets</text>
  <text x="1597" y="792" class="small">Runtime config</text>
  <rect x="1405" y="835" width="305" height="78" class="ops" />
  <text x="1469" y="864" class="text">CloudWatch + Alarms</text>
  <text x="1452" y="887" class="small">Logs, metrics, alerts, audit events</text>

  <path d="M645 242 C645 298 1450 300 1475 745" class="softArrow" />
  <path d="M1405 774 C1320 774 1280 680 1205 681" class="softArrow" />
  <path d="M1570 774 C1450 774 1320 682 1205 681" class="softArrow" />
  <path d="M1235 681 C1300 681 1340 868 1405 874" class="softArrow" />

  <rect x="55" y="1000" width="770" height="105" class="boundary" />
  <text x="80" y="1032" class="label">Failure and Recovery Signals</text>
  <text x="80" y="1062" class="small">AZ outage: pods continue in surviving AZs. Bad deployment: rolling update + probes stop bad pods receiving traffic.</text>
  <text x="80" y="1086" class="small">Flash sale: HPA scales pods first; node autoscaler adds EC2 capacity when scheduling pressure appears.</text>

  <rect x="870" y="1000" width="870" height="105" class="boundary" />
  <text x="895" y="1032" class="label">Security and Governance Controls</text>
  <text x="895" y="1062" class="small">WAF filters public traffic. IAM roles for service accounts avoid broad node permissions. Secrets are externalized.</text>
  <text x="895" y="1086" class="small">CI/CD gates include Gitleaks, Trivy, CycloneDX SBOM, SonarQube, and OWASP ZAP baseline scanning.</text>
</svg>
